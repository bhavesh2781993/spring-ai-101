spring.application.name: s06-rag-pgvector

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sbdocs
    username: admin
    password: password
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4
    vectorstore:
      pgvector:
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: 1536
  docker:
    compose:

      lifecycle-management: start_only
  sql:
    init:
      mode: always
